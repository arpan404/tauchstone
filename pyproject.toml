[project]
name = "tauchstone"
version = "0.1.0"
description = "Find a drug. Attack the hypothesis. Keep only what survives."
requires-python = ">=3.12,<3.13"
dependencies = [
  # Data
  "numpy>=2",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=17",
  "duckdb>=1.1",
  "h5py>=3.11",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "httpx>=0.27",
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "rdkit>=2026.9.1",
  "jinja2>=3.1.6",
  "weasyprint>=70.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "matplotlib>=3.9",
  "jupyterlab>=4",
  "pypdf>=7.0.0",
]
ml = [
    "torch>=2.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
pythonpath = [".", "services/api"]
markers = [
  "data: needs the real downloaded data in $TS_DATA_DIR (skipped otherwise)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
