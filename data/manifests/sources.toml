  "level5_beta_trt_sh_n238351x12328.gctx",   # 11.75 GB, shRNA
  "level5_beta_trt_oe_n34171x12328.gctx",    # 1.69 GB, over-expression
  "level5_beta_trt_xpr_n142901x12328.gctx",  # 6.52 GB, CRISPR
