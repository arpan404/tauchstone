# Every raw file the project uses. `make data` downloads each one into
# $TS_DATA_DIR/raw/<group>/ and records its SHA-256 in data/manifests/checksums.json.
# `sha512_list` points at an upstream checksum file to verify against, when GEO publishes one.
# `tier`: core (Tier 1-3) or stretch (Tier 4). `make data` fetches both; `--tier core` for core only.
# `opt_in = true`: never fetched by `make data` or any --tier; only with `--group <group>`.

[[source]]
group = "lincs/GSE92742"
tier = "core"
sha512_list = "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE92nnn/GSE92742/suppl/GSE92742_SHA512SUMS.txt.gz"
base = "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE92nnn/GSE92742/suppl/"
files = [
  "GSE92742_Broad_LINCS_Level5_COMPZ.MODZ_n473647x12328.gctx.gz",
  "GSE92742_Broad_LINCS_sig_info.txt.gz",
  "GSE92742_Broad_LINCS_sig_metrics.txt.gz",
  "GSE92742_Broad_LINCS_gene_info.txt.gz",
  "GSE92742_Broad_LINCS_pert_info.txt.gz",
  "GSE92742_Broad_LINCS_pert_metrics.txt.gz",
  "GSE92742_Broad_LINCS_cell_info.txt.gz",
  "GSE92742_Broad_LINCS_README.pdf",
]

