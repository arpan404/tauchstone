# ---- Evidence: UniProt reviewed (Swiss-Prot) human proteome with Entrez, Ensembl, PDB, ChEMBL xrefs.
[[source]]
group = "evidence/uniprot"
tier = "core"
single_connection = true  # streamed endpoint, no byte ranges
base = "https://rest.uniprot.org/uniprotkb/"
files = [
  { name = "uniprot_human_swissprot.tsv.gz", path = "stream?compressed=true&format=tsv&query=%28organism_id%3A9606%29%20AND%20%28reviewed%3Atrue%29&fields=accession%2Cid%2Cgene_primary%2Cgene_names%2Cprotein_name%2Cxref_geneid%2Cxref_ensembl%2Cxref_pdb%2Cxref_chembl%2Clength" },
]

