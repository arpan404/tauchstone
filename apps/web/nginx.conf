server {
  listen 80;
  root /usr/share/nginx/html;

  # Same /api prefix as the Vite dev proxy.
  location /api/ {
    proxy_pass http://api:8000/;
  }

  # Evidence cards carry structure urls rooted at /structures (API path);
  # the web fetches them same-origin, so proxy them to the api too.
  location /structures/ {
    proxy_pass http://api:8000/structures/;
  }

  location / {
    try_files $uri /index.html;
  }
}
