<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tauchstone. Two C-shaped folds facing opposite ways: a cut across a tau
       filament from an Alzheimer's brain (PDB 5O3L), idealised. -->
