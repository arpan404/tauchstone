  <g transform="translate(32 32) scale(0.8) translate(-32 -32)" fill="none" stroke="#ffffff"
     stroke-width="9" stroke-linecap="round">
    <path d="M34 12a15 15 0 1 0 11 22"/>
    <path d="M30 52a15 15 0 1 0-11-22"/>
  </g>
</svg>
