    <circle cx="25" cy="25" r="6"/>
    <circle cx="39" cy="25" r="6" fill-opacity="0.3"/>
    <circle cx="53" cy="25" r="6" fill-opacity="0.3"/>
    <circle cx="11" cy="39" r="6" fill-opacity="0.3"/>
    <circle cx="25" cy="39" r="6"/>
    <circle cx="39" cy="39" r="6" fill-opacity="0.3"/>
    <circle cx="53" cy="39" r="6" fill-opacity="0.3"/>
    <circle cx="11" cy="53" r="6" fill-opacity="0.3"/>
