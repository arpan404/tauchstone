openapi: 3.1.0
info:
  title: "Tauchstone: Second Life API"
  version: 0.1.0
  description: |
    Contract between the API (WS6) and the web app (WS7). Frozen Nov 5 2026; changes go through
    the engineering lead.

    Conventions
    - Gene IDs are Entrez IDs as strings. Candidate ids are LINCS pert_id (BRD-...).
    - Reversal sign: NEGATIVE scores mean the drug reverses the AD signature.
    - The truth table (hidden validation outcomes) is server-only. A hidden outcome appears in a
      response only inside `revealed` of POST /attack/{session_id}/run, after that experiment is
      committed. Hidden contexts are listed by id/label/type only, never with their value.
    - Every result carries a `provenance` object.
    - Wording: verdicts are SUPPORTED_SO_FAR / FRAGILE_CONTEXT_DEPENDENT / INSUFFICIENT_EVIDENCE.
      Never true/false, never clinical language.
servers:
  - url: http://localhost:8000
    description: dev (the web app calls it through /api)

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status, mock]
                properties:
                  status: { type: string, enum: [ok] }
                  mock: { type: boolean, description: true when serving mock data }

  /signatures/{cohort}:
    get:
      operationId: getSignature
      summary: Gene statistics for the volcano plot
      parameters:
        - name: cohort
          in: path
          required: true
          schema: { type: string, enum: [GSE132903, GSE173955, GSE53697] }
          description: |
            Only GSE132903 (primary) is shown before an attack. Held-out cohorts return 403 until
            an attack session has revealed them (pass session_id).
        - name: variant
          in: query
          schema: { type: string, enum: [main, composition_adjusted], default: main }
        - name: session_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signature" }
        "403": { $ref: "#/components/responses/Hidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /candidates:
    get:
      operationId: listCandidates
      summary: Ranked candidates with the three scores and the consensus
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: ranking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateList" }

  /candidates/{candidate_id}/evidence:
    get:
      operationId: getEvidence
      summary: Evidence card fields with evidence level and source links
      parameters:
        - { name: candidate_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: evidence card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceCard" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attack:
    post:
      operationId: startAttack
      summary: Start an attack session; returns budget and the first recommended experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id]
              properties:
                candidate_id: { type: string }
                mode: { $ref: "#/components/schemas/Mode" }
                budget: { type: integer, default: 5, minimum: 1, maximum: 10 }
      responses:
        "200":
          description: session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttackSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attack/{session_id}/run:
    post:
      operationId: runExperiment
      summary: Commit one experiment, reveal its hidden outcome, update belief, recommend next
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context_id]
              properties:
                context_id:
                  type: string
                  description: Any still-hidden context; usually the recommended one, but the judge may pick another.
                mode:
                  $ref: "#/components/schemas/Mode"
                  description: Mode used for the NEXT recommendation (the toggle). Defaults to the session's current mode.
      responses:
        "200":
          description: outcome revealed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: context already revealed, unknown for this candidate, or budget exhausted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /benchmark:
    get:
      operationId: getBenchmark
      summary: Aggregate policy results with CIs, calibration and tests
      responses:
        "200":
          description: benchmark
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Benchmark" }
        "404":
          description: benchmark not run yet (it only runs after the preregistration hash is committed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /exploratory/single-cell:
    get:
      operationId: getSingleCellExploratory
      summary: Exploratory single-cell pseudobulk panel. Never part of the preregistered benchmark.
      description: |
        Pseudobulk per donor and cell type from GSE272082 and GSE175814, limma-voom AD minus control
        per cohort, cell type (and region where a cohort has several), then the top 20 benchmark-pool
        drugs scored against each signature with the same three methods as the bulk ranking.
        Cohorts are never merged. Nothing here feeds the ranking, truth table, engine or benchmark.
      responses:
        "200":
          description: exploratory panel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SingleCellExploratory" }
        "404":
          description: panel not built yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------- MVP (Nov 7): projects, live screens, drugs, lookup, resources, reports ----------------
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: projects
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                signature_id: { type: [string, "null"], description: "built-in signature id (GSE132903, GSE173955) or null for an upload project" }
      responses:
        "200":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /screens:
    post:
      operationId: startScreen
      summary: Start a live screen. JSON body for a built-in signature, multipart with a CSV file for an upload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, signature_id]
              properties:
                project_id: { type: string }
                signature_id: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [project_id, file]
              properties:
                project_id: { type: string }
                name: { type: string }
                file: { type: string, format: binary, description: "CSV with columns gene (symbol or Entrez), log2fc, stat, fdr" }
      responses:
        "200":
          description: screen queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Screen" }
        "422":
          description: invalid upload (missing columns, too few mapped genes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /screens/{screen_id}:
    get:
      operationId: getScreen
      parameters:
        - { name: screen_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: screen state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Screen" }
        "404": { $ref: "#/components/responses/NotFound" }

  /screens/{screen_id}/events:
    get:
      operationId: streamScreen
      summary: Server-sent events. Each event `data:` is a ScreenEvent JSON object; the stream ends after status done or failed.
      parameters:
        - { name: screen_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: text/event-stream of ScreenEvent
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ScreenEvent" }

  /projects/{project_id}/candidates:
    get:
      operationId: listProjectCandidates
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
        - { name: approved, in: query, schema: { type: boolean } }
        - { name: brain_cells, in: query, schema: { type: boolean } }
        - { name: penetrant, in: query, schema: { type: boolean } }
        - { name: min_contexts, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 5000 } }
      responses:
        "200":
          description: ranked candidates for the project's latest screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCandidates" }
        "404": { $ref: "#/components/responses/NotFound" }

  /drugs/{drug_id}:
    get:
      operationId: getDrug
      parameters:
        - { name: drug_id, in: path, required: true, schema: { type: string } }
        - { name: project_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: drug detail with evidence gaps, contexts and 3D molecule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrugDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /drugs/{drug_id}/resources:
    get:
      operationId: getDrugResources
      parameters:
        - { name: drug_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: cached cross-resource agreement (report-only)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ResourceAgreement" } }

  /lookup:
    post:
      operationId: lookupCompounds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names: { type: array, items: { type: string }, maxItems: 200 }
                project_id: { type: string }
      responses:
        "200":
          description: one result per input name, same order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LookupResult" } }

  /reports/{drug_id}:
    get:
      operationId: getReportHtml
      parameters:
        - { name: drug_id, in: path, required: true, schema: { type: string } }
        - { name: project_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, description: "attack session for this drug; adds a snapshot with revealed tests only", schema: { type: string } }
      responses:
        "200": { description: one-page report, content: { text/html: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{drug_id}.pdf:
    get:
      operationId: getReportPdf
      parameters:
        - { name: drug_id, in: path, required: true, schema: { type: string } }
        - { name: project_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, description: "attack session for this drug; adds a snapshot with revealed tests only", schema: { type: string } }
      responses:
        "200": { description: report PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{project_id}/candidates.csv:
    get:
      operationId: exportCandidatesCsv
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: CSV export, content: { text/csv: { schema: { type: string } } } }


components:
  responses:
    NotFound:
      description: not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Hidden:
      description: held-out data not revealed yet
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    Mode:
      type: string
      enum: [attack, learn]
      default: attack
      description: attack = pick the context most likely to break the claim; learn = largest expected change in belief.

    Verdict:
      type: string
      enum: [SUPPORTED_SO_FAR, FRAGILE_CONTEXT_DEPENDENT, INSUFFICIENT_EVIDENCE]
      description: |
        Display labels: "Supported so far", "Fragile / context-dependent", "Insufficient evidence".

    Provenance:
      type: object
      required: [dataset_accession, processing_version, git_commit, timestamp]
      properties:
        step: { type: string }
        dataset_accession: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        inputs: { type: object, additionalProperties: { type: [string, "null"] }, description: raw file key -> sha256 }
        sample_filter: { type: string }
        gene_mapping_version: { type: string }
        model: { type: string }
        parameters: { type: object }
        random_seed: { type: [integer, "null"] }
        validation_context: { type: [string, "null"] }
        processing_version: { type: string }
        git_commit: { type: string }
        timestamp: { type: string, format: date-time }
        output: { type: string }
        output_sha256: { type: string }

    SourceLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, examples: ["ChEMBL CHEMBL25"] }
        url: { type: string, format: uri }

    # ---------------- Signatures ----------------
    GeneStat:
      type: object
      required: [entrez_id, symbol, log2fc, stat, p_value, fdr]
      properties:
        entrez_id: { type: string }
        symbol: { type: string }
        log2fc: { type: number, description: AD minus control }
        stat: { type: number, description: moderated t or Wald; positive = higher in AD }
        p_value: { type: number }
        fdr: { type: number }
        query_set: { type: [string, "null"], enum: [up, down, null], description: membership in the LINCS query sets }

    Signature:
      type: object
      required: [cohort, variant, method, tissue, n_ad, n_control, genes, provenance]
      properties:
        cohort: { type: string }
        variant: { type: string, enum: [main, composition_adjusted] }
        method: { type: string, enum: [limma, limma-trend, deseq2] }
        tissue: { type: string, examples: ["middle temporal gyrus"] }
        platform: { type: string }
        n_ad: { type: integer }
        n_control: { type: integer }
        n_fdr05: { type: integer, description: genes with FDR < 0.05 }
        genes: { type: array, items: { $ref: "#/components/schemas/GeneStat" } }
        sign_check:
          type: array
          description: Known AD genes and whether the observed direction matches expectation
          items:
            type: object
            required: [symbol, expected, stat, matches]
            properties:
              symbol: { type: string }
              expected: { type: string, enum: [up, down] }
              stat: { type: number }
              matches: { type: boolean }
        provenance: { $ref: "#/components/schemas/Provenance" }

    # ---------------- Candidates ----------------
    MethodScores:
      type: object
      description: Median standardized score across ranking contexts. Negative = reversal.
      required: [wtcs, ks, cosine]
      properties:
        wtcs: { type: number, description: CMap weighted connectivity (z) }
        ks: { type: number, description: unweighted KS connectivity (z) }
        cosine: { type: number, description: cosine similarity (z) }

    Candidate:
      type: object
      required: [id, rank, name, consensus, consensus_iqr, n_ranking_contexts, scores, by_cell_line]
      properties:
        id: { type: string, description: LINCS pert_id }
        rank: { type: integer, minimum: 1 }
        name: { type: string, description: pert_iname }
        consensus: { type: number, description: median consensus across ranking contexts; negative = reversal }
        consensus_iqr: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        n_ranking_contexts: { type: integer }
        n_held_out_contexts: { type: integer, description: count only; their scores are hidden }
        scores: { $ref: "#/components/schemas/MethodScores" }
        by_cell_line:
          type: array
          description: Heatmap cells. RANKING contexts only, never held-out ones.
          items:
            type: object
            required: [cell_id, consensus, n_contexts]
            properties:
              cell_id: { type: string }
              consensus: { type: number }
              n_contexts: { type: integer }
        approval_status: { $ref: "#/components/schemas/ApprovalStatus" }
        flags:
          type: array
          items: { type: string, enum: [composition_sensitive, few_contexts, known_positive] }
        is_demo_candidate: { type: boolean, description: chosen by the preregistered rule (ranks 1, 5, 12) }

    CandidateList:
      type: object
      required: [signature, n_ranked, candidates, provenance]
      properties:
        signature: { type: string, examples: ["GSE132903__main"] }
        n_ranked: { type: integer, description: compounds with >= 3 ranking contexts }
        permutation_control:
          type: object
          description: Label-permutation control (Tier 1 gate)
          properties:
            n_permutations: { type: integer }
            theta: { type: number, description: 5th percentile of the null; reversal threshold }
            passed: { type: boolean }
        candidates: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
        provenance: { $ref: "#/components/schemas/Provenance" }

    # ---------------- Evidence ----------------
    ApprovalStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, investigational, preclinical, unknown] }
        max_phase: { type: [number, "null"], description: ChEMBL max_phase }
        source: { $ref: "#/components/schemas/SourceLink" }
        withdrawn:
          type: boolean
          description: |
            ChEMBL 37 withdrawn flag or a 'Withdrawn' drug warning on the parent or any salt
            form (evidence/withdrawn.parquet). Display only; never feeds ranking or the pool.
            Absent when the table is not built.
        withdrawn_year: { type: integer, description: earliest withdrawal year (ChEMBL drug_warning) }
        withdrawn_class: { type: string, description: "warning classes, '; '-joined, earliest first", examples: [hepatotoxicity] }
        withdrawn_country: { type: string, description: "countries, '; '-joined, earliest first" }
        withdrawn_source: { type: string, examples: ["ChEMBL 37"] }

    ExposureLevel:
      type: string
      enum: [measured_human_cns, measured_preclinical, curated, predicted, none]
      description: |
        Hierarchy, strongest first: measured human CNS PK > measured preclinical brain/plasma or
        BBB assay > curated > predicted. Always shown with its label.

    Target:
      type: object
      required: [symbol, uniprot, entrez_id]
      properties:
        symbol: { type: string }
        uniprot: { type: string }
        entrez_id: { type: string }
        ensembl_id: { type: string }
        action_type: { type: [string, "null"], examples: [INHIBITOR, AGONIST] }
        brain_expression:
          type: array
          items:
            type: object
            required: [context, ntpm]
            properties:
              context: { type: string, examples: ["cerebral cortex", "microglia"] }
              kind: { type: string, enum: [region, cell_type] }
              ntpm: { type: number }
        ad_association_score: { type: [number, "null"], description: Open Targets overall association with MONDO_0004975 }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceLink" } }

    Structure:
      type: object
      required: [pdb_id, uniprot, url, note]
      properties:
        pdb_id: { type: string }
        uniprot: { type: string }
        method: { type: string }
        resolution_angstrom: { type: [number, "null"] }
        url: { type: string, description: local path served by the API (offline), e.g. /structures/1ABC.cif }
        note: { type: string, const: "Target context only. Not evidence that the drug binds this structure." }

    EvidenceCard:
      type: object
      required: [candidate_id, name, targets, approval_status, brain_exposure, boundary, provenance]
      properties:
        candidate_id: { type: string }
        name: { type: string }
        chembl_id: { type: [string, "null"] }
        mechanism: { type: [string, "null"] }
        targets: { type: array, items: { $ref: "#/components/schemas/Target" } }
        approval_status: { $ref: "#/components/schemas/ApprovalStatus" }
        brain_exposure:
          type: object
          required: [level, summary]
          description: |
            Shown on the card BEFORE any attack: only the predicted level (physchem / CNS MPO).
            Measured CNS exposure is a hidden validation context revealed by an attack.
          properties:
            level: { $ref: "#/components/schemas/ExposureLevel" }
            summary: { type: string }
            sources: { type: array, items: { $ref: "#/components/schemas/SourceLink" } }
        structure: { oneOf: [{ $ref: "#/components/schemas/Structure" }, { type: "null" }] }
        boundary:
          type: string
          const: "Research hypothesis only. Not a treatment recommendation. Gene expression reversal does not establish efficacy, safety, dosing, brain exposure or clinical benefit."
        provenance: { $ref: "#/components/schemas/Provenance" }

    # ---------------- Attack ----------------
    ContextType:
      type: string
      enum: [held_out_cohort, composition_adjusted, lincs_context, brain_exposure, cell_type]

    ContextState:
      type: object
      required: [context_id, type, label, status, p_survive]
      properties:
        context_id: { type: string }
        type: { $ref: "#/components/schemas/ContextType" }
        label: { type: string, examples: ["GSE173955 hippocampus (RNA-seq)", "MCF7 · 10 uM · 24 h"] }
        status: { type: string, enum: [hidden, revealed] }
        p_survive: { type: number, minimum: 0, maximum: 1, description: current predicted probability the claim survives this test }
        acquisition: { type: [number, "null"], description: score under the current mode; null once revealed }
        outcome: { type: [string, "null"], enum: [survive, fail, null], description: only set when revealed }

    Claim:
      type: object
      required: [text, q, theta, n_contexts]
      properties:
        text: { type: string, examples: ["X reverses the AD signature in at least 70% of predefined validation contexts"] }
        q: { type: number, const: 0.7 }
        theta: { type: number }
        n_contexts: { type: integer }

    Belief:
      type: object
      required: [p_claim_holds]
      properties:
        p_claim_holds: { type: number, minimum: 0, maximum: 1 }
        interval: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: bootstrap 90% interval }

    AttackSession:
      type: object
      required: [session_id, candidate_id, mode, budget, budget_remaining, claim, belief, verdict, contexts, recommended_context_id, rationale]
      properties:
        session_id: { type: string }
        candidate_id: { type: string }
        candidate_name: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        budget: { type: integer }
        budget_remaining: { type: integer }
        claim: { $ref: "#/components/schemas/Claim" }
        belief: { $ref: "#/components/schemas/Belief" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        contexts: { type: array, items: { $ref: "#/components/schemas/ContextState" } }
        recommended_context_id: { type: [string, "null"] }
        rationale: { type: string, description: one plain-language sentence on why this test is recommended }
        preregistered: { type: boolean, description: "false when hidden tests were built on the fly for a drug outside the sealed set" }
        history:
          type: array
          items: { $ref: "#/components/schemas/RevealedOutcome" }

    RevealedOutcome:
      type: object
      required: [context_id, type, label, outcome, rule, belief_before, belief_after]
      properties:
        context_id: { type: string }
        type: { $ref: "#/components/schemas/ContextType" }
        label: { type: string }
        outcome: { type: string, enum: [survive, fail] }
        value: { type: [number, "null"], description: e.g. the reversal score in that context }
        threshold: { type: [number, "null"] }
        rule: { type: string, description: plain-language survive rule for this context type }
        detail: { type: string }
        belief_before: { type: number }
        belief_after: { type: number }
        mode_used: { $ref: "#/components/schemas/Mode" }
        provenance: { $ref: "#/components/schemas/Provenance" }

    RunResult:
      allOf:
        - $ref: "#/components/schemas/AttackSession"
        - type: object
          required: [revealed, done]
          properties:
            revealed: { $ref: "#/components/schemas/RevealedOutcome" }
            done: { type: boolean, description: budget exhausted or no hidden contexts left }

    # ---------------- Benchmark ----------------
    Interval:
      type: object
      required: [estimate, ci95]
      properties:
        estimate: { type: number }
        ci95: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }

    PolicyResult:
      type: object
      required: [policy, label, experiments_to_correct_verdict, fragile_recall_at_3, fragile_recall_at_5, decision_accuracy]
      properties:
        policy:
          type: string
          enum: [random, greedy_strongest, max_failure, max_uncertainty, expected_decision_change, tauchstone_hybrid, decision_lookahead_hybrid]
        label: { type: string }
        experiments_to_correct_verdict:
          type: object
          required: [median, iqr, ci95]
          properties:
            median: { type: number }
            iqr: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
            ci95: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: bootstrap CI of the median }
        fragile_recall_at_3: { $ref: "#/components/schemas/Interval" }
        fragile_recall_at_5: { $ref: "#/components/schemas/Interval" }
        decision_accuracy: { $ref: "#/components/schemas/Interval" }
        brier: { type: [number, "null"] }

    Benchmark:
      type: object
      required: [n_candidates, n_seeds, budget, policies, calibration, tests, preregistration_sha256, provenance]
      properties:
        n_candidates: { type: integer }
        n_seeds: { type: integer }
        budget: { type: integer }
        policies: { type: array, items: { $ref: "#/components/schemas/PolicyResult" } }
        calibration:
          type: array
          description: reliability curve for P(survive)
          items:
            type: object
            required: [bin_lo, bin_hi, mean_predicted, observed_rate, n]
            properties:
              bin_lo: { type: number }
              bin_hi: { type: number }
              mean_predicted: { type: number }
              observed_rate: { type: number }
              n: { type: integer }
        tests:
          type: array
          description: paired Wilcoxon signed-rank vs tauchstone_hybrid, Holm-corrected
          items:
            type: object
            required: [policy_a, policy_b, metric, p_holm]
            properties:
              policy_a: { type: string }
              policy_b: { type: string }
              metric: { type: string }
              statistic: { type: number }
              p_holm: { type: number }
        preregistration_sha256: { type: string }
        preregistration_commit: { type: string }
        provenance: { $ref: "#/components/schemas/Provenance" }

    SingleCellSignature:
      type: object
      description: One pseudobulk AD-minus-control signature (cohort x region x cell type).
      required: [signature_id, cohort, cell_type, n_donors_ad, n_donors_control, n_nuclei, status]
      properties:
        signature_id: { type: string, examples: ["GSE272082|PFC|astrocytes"] }
        cohort: { type: string, examples: ["GSE272082"] }
        region: { type: [string, "null"], description: brain region when a cohort has several; null otherwise }
        cell_type: { type: string, examples: ["astrocytes"] }
        n_donors_ad: { type: integer }
        n_donors_control: { type: integer }
        n_nuclei: { type: integer }
        n_genes_tested: { type: [integer, "null"] }
        n_fdr05: { type: [integer, "null"], description: genes at FDR < 0.05 (AD minus control) }
        status:
          type: string
          enum: [ok, insufficient_donors]
          description: insufficient_donors when either group has fewer than 3 donors; not scored

    SingleCellScore:
      type: object
      required: [signature_id, consensus]
      properties:
        signature_id: { type: string }
        consensus: { type: [number, "null"], description: same consensus as the bulk ranking; negative = reversal; null when not scored }
        scores: { oneOf: [{ $ref: "#/components/schemas/MethodScores" }, { type: "null" }] }

    SingleCellDrug:
      type: object
      required: [candidate_id, name, pool_rank, bulk_consensus, scores]
      properties:
        candidate_id: { type: string, description: LINCS pert_id }
        name: { type: string }
        pool_rank: { type: integer, minimum: 1 }
        bulk_consensus: { type: number, description: consensus against the primary bulk signature, for comparison }
        scores: { type: array, items: { $ref: "#/components/schemas/SingleCellScore" } }

    SingleCellExploratory:
      type: object
      required: [label, signatures, drugs, provenance]
      properties:
        label: { type: string, const: "Exploratory, not part of the preregistered benchmark" }
        note: { type: string, description: plain-language limits (donor counts, cell typing method) }
        cell_typing: { type: string, description: how nuclei were assigned to cell types }
        signatures: { type: array, items: { $ref: "#/components/schemas/SingleCellSignature" } }
        drugs: { type: array, items: { $ref: "#/components/schemas/SingleCellDrug" } }
        provenance: { $ref: "#/components/schemas/Provenance" }

    # ---------------- MVP schemas ----------------
    Project:
      type: object
      required: [id, name, kind, created_at, preregistered]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [builtin, upload] }
        signature_id: { type: [string, "null"] }
        description: { type: string, examples: ["97 AD · 98 control · limma · 16,437 genes"] }
        n_ranked: { type: [integer, "null"] }
        n_attack_ready: { type: [integer, "null"], description: candidates with hidden tests prepared }
        last_screen_id: { type: [string, "null"] }
        preregistered: { type: boolean, description: "true only for the built-in GSE132903 project" }
        created_at: { type: string, format: date-time }

    ScreenHit:
      type: object
      required: [rank, drug_id, name, consensus]
      properties:
        rank: { type: integer }
        drug_id: { type: string }
        name: { type: string }
        consensus: { type: number }

    Screen:
      type: object
      required: [id, project_id, status, n_signatures, n_scored, elapsed_s, preregistered]
      properties:
        id: { type: string }
        project_id: { type: string }
        signature_id: { type: [string, "null"] }
        status: { type: string, enum: [queued, mapping, scoring, aggregating, done, failed] }
        n_signatures: { type: integer, examples: [113310] }
        n_scored: { type: integer }
        elapsed_s: { type: number }
        n_genes_mapped: { type: [integer, "null"] }
        n_ranked: { type: [integer, "null"] }
        top: { type: array, items: { $ref: "#/components/schemas/ScreenHit" } }
        error: { type: [string, "null"] }
        preregistered: { type: boolean }

    ScreenEvent:
      allOf:
        - $ref: "#/components/schemas/Screen"

    EvidenceGaps:
      type: object
      description: Per-drug gaps, shown as chips. Derived from ranking contexts only (never held-out data).
      required: [brain_cells, cancer_lines_only, doses_um, times_h, exposure, has_targets]
      properties:
        brain_cells:
          type: array
          description: ranking contexts in neural lines (SHSY5Y, NEU, NEU.KCL, MNEU.E, NPC, NPC.CAS9, NPC.TAK, FIBRNPC)
          items:
            type: object
            required: [cell_id, consensus, below_theta]
            properties:
              cell_id: { type: string }
              consensus: { type: number }
              below_theta: { type: boolean }
        cancer_lines_only: { type: boolean }
        doses_um: { type: array, items: { type: number } }
        times_h: { type: array, items: { type: number } }
        exposure:
          type: object
          required: [level, label]
          properties:
            level: { $ref: "#/components/schemas/ExposureLevel" }
            label: { type: string, examples: ["predicted low", "predicted penetrant", "measured"] }
            measured_available: { type: boolean, description: "true if a measured value exists; the value itself stays hidden until an attack reveals it" }
        has_targets: { type: boolean }

    ContextCell:
      type: object
      required: [cell_id, dose, time, consensus]
      properties:
        cell_id: { type: string }
        dose: { type: string, examples: ["10 uM"] }
        time: { type: string, examples: ["6 h"] }
        consensus: { type: number }
        neural: { type: boolean }

    Molecule3D:
      type: object
      required: [formula, atoms, bonds]
      properties:
        formula: { type: string, examples: ["C23H27N5O7S"] }
        smiles: { type: string }
        atoms:
          type: array
          items:
            type: object
            required: [el, x, y, z]
            properties:
              el: { type: string }
              x: { type: number }
              y: { type: number }
              z: { type: number }
        bonds:
          type: array
          items:
            type: array
            items: { type: integer }
            minItems: 3
            maxItems: 3
            description: "[atom_i, atom_j, order]"
        method: { type: string, examples: ["RDKit ETKDGv3 + MMFF94, seed 20261105"] }

    DrugDetail:
      type: object
      required: [drug_id, name, consensus, n_contexts, gaps, contexts, preregistered, attack_ready]
      properties:
        drug_id: { type: string }
        name: { type: string }
        pool_rank: { type: [integer, "null"] }
        rank_total: { type: [integer, "null"], examples: [1816] }
        consensus: { type: number }
        n_contexts: { type: integer }
        scores: { $ref: "#/components/schemas/MethodScores" }
        approval_status: { $ref: "#/components/schemas/ApprovalStatus" }
        mechanism: { type: [string, "null"] }
        targets: { type: array, items: { $ref: "#/components/schemas/Target" } }
        structure: { oneOf: [{ $ref: "#/components/schemas/Structure" }, { type: "null" }] }
        gaps: { $ref: "#/components/schemas/EvidenceGaps" }
        contexts: { type: array, items: { $ref: "#/components/schemas/ContextCell" }, description: ranking contexts only }
        molecule: { oneOf: [{ $ref: "#/components/schemas/Molecule3D" }, { type: "null" }] }
        n_hidden_tests: { type: [integer, "null"] }
        attack_ready: { type: boolean }
        preregistered: { type: boolean, description: "true if the drug is in the sealed benchmark or development pool of the built-in project" }
        provenance: { $ref: "#/components/schemas/Provenance" }

    LookupResult:
      type: object
      required: [query, status]
      properties:
        query: { type: string }
        status: { type: string, enum: [ranked, not_rankable, not_in_lincs, unrecognized], description: "not_in_lincs: a known compound with no LINCS match; unrecognized: no source knows the name" }
        drug_id: { type: [string, "null"] }
        name: { type: [string, "null"] }
        pool_rank: { type: [integer, "null"] }
        rank_total: { type: [integer, "null"] }
        consensus: { type: [number, "null"] }
        n_contexts: { type: [integer, "null"] }
        attack_ready: { type: boolean }
        preregistered: { type: boolean }

    ResourceAgreement:
      type: object
      required: [resource, status]
      properties:
        resource: { type: string, enum: [tauchstone_lincs_gold, clue, perturb_seqr] }
        status: { type: string, enum: [available, not_fetched, needs_key, not_available, not_found] }
        rank: { type: [integer, "null"] }
        n_ranked: { type: [integer, "null"] }
        score: { type: [number, "null"] }
        fetched_at: { type: [string, "null"] }
        source_url: { type: [string, "null"] }
        note: { type: [string, "null"] }

    ProjectCandidate:
      allOf:
        - $ref: "#/components/schemas/Candidate"
        - type: object
          properties:
            brain_cells: { type: boolean, description: "has >= 1 ranking context in a neural line" }
            penetrant: { type: [boolean, "null"], description: "predicted or measured brain-penetrant; null if unknown" }
            exposure_label: { type: string, examples: ["predicted low"] }
            cancer_lines_only: { type: boolean }
            attack_ready: { type: boolean }
            preregistered: { type: boolean }

    ProjectCandidates:
      type: object
      required: [project_id, n_ranked, preregistered, candidates]
      properties:
        project_id: { type: string }
        screen_id: { type: [string, "null"] }
        n_ranked: { type: integer }
        n_total_eligible: { type: integer, description: "rows matching the filters before limit" }
        preregistered: { type: boolean }
        candidates: { type: array, items: { $ref: "#/components/schemas/ProjectCandidate" } }
