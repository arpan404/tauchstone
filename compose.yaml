# Expo stack. Runs fully offline once images are built:
#   make demo        (build images + freeze the demo bundle)
#   docker compose up
# The api container only sees the frozen demo bundle, never raw data.
# Fixed project and image names so images loaded with `docker load` are reused on any laptop
# (otherwise the names depend on the checkout folder and compose would try to rebuild offline).
name: tauchstone
services:
  api:
    image: tauchstone-api:latest
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      TS_API_MOCK: "0"
      TS_DATA_DIR: /data
      TS_CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./data/demo:/data:ro
    ports:
      - "${TS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: tauchstone-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TS_WEB_PORT:-8080}:80"
